name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  public-boundary:
    name: Public boundary and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependency
        run: python -m pip install -r requirements-validation.txt
      - name: Validate public tree and reachable Git history
        run: python scripts/validate.py --component static --history

  secret-scan:
    name: Secret scan / complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned checksum-verified scanners
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/awp-secret-scanners"
          mkdir -p "${tools_dir}/bin" "${tools_dir}/gitleaks" "${tools_dir}/trufflehog"

          download_and_verify() {
            local release_url="$1"
            local asset="$2"
            local checksums="$3"
            local directory="$4"
            curl --fail --show-error --silent --location --retry 3 \
              --proto '=https' --tlsv1.2 \
              --output "${directory}/${asset}" "${release_url}/${asset}"
            curl --fail --show-error --silent --location --retry 3 \
              --proto '=https' --tlsv1.2 \
              --output "${directory}/${checksums}" "${release_url}/${checksums}"
            awk -v asset="${asset}" \
              '$2 == asset || $2 == "*" asset { print }' \
              "${directory}/${checksums}" > "${directory}/selected.sha256"
            test "$(wc -l < "${directory}/selected.sha256")" -eq 1
            (
              cd "${directory}"
              sha256sum -c selected.sha256
            )
          }

          gitleaks_version="8.30.1"
          gitleaks_asset="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          gitleaks_checksums="gitleaks_${gitleaks_version}_checksums.txt"
          gitleaks_release="https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}"
          download_and_verify \
            "${gitleaks_release}" "${gitleaks_asset}" "${gitleaks_checksums}" \
            "${tools_dir}/gitleaks"
          tar -xzf "${tools_dir}/gitleaks/${gitleaks_asset}" \
            -C "${tools_dir}/gitleaks" gitleaks
          install -m 0755 "${tools_dir}/gitleaks/gitleaks" "${tools_dir}/bin/gitleaks"

          trufflehog_version="3.97.0"
          trufflehog_asset="trufflehog_${trufflehog_version}_linux_amd64.tar.gz"
          trufflehog_checksums="trufflehog_${trufflehog_version}_checksums.txt"
          trufflehog_release="https://github.com/trufflesecurity/trufflehog/releases/download/v${trufflehog_version}"
          download_and_verify \
            "${trufflehog_release}" "${trufflehog_asset}" "${trufflehog_checksums}" \
            "${tools_dir}/trufflehog"
          tar -xzf "${tools_dir}/trufflehog/${trufflehog_asset}" \
            -C "${tools_dir}/trufflehog" trufflehog
          install -m 0755 "${tools_dir}/trufflehog/trufflehog" "${tools_dir}/bin/trufflehog"

          case "$("${tools_dir}/bin/gitleaks" version)" in
            *"${gitleaks_version}"*) ;;
            *) exit 1 ;;
          esac
          case "$("${tools_dir}/bin/trufflehog" --version)" in
            *"${trufflehog_version}"*) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "${tools_dir}/bin" >> "${GITHUB_PATH}"
      - name: Scan complete history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d "${RUNNER_TEMP}/awp-gitleaks.XXXXXX")"
          trap 'rm -rf -- "${output_dir}"' EXIT
          set +e
          gitleaks git --no-banner --no-color --redact=100 \
            --log-opts="--all --full-history --no-textconv" . \
            > "${output_dir}/stdout" 2> "${output_dir}/stderr"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            printf 'gitleaks status=passed\n'
            exit 0
          fi
          printf 'gitleaks status=failed exit_code=%s\n' "${status}"
          exit "${status}"
      - name: Scan complete history with TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d "${RUNNER_TEMP}/awp-trufflehog.XXXXXX")"
          trap 'rm -rf -- "${output_dir}"' EXIT
          set +e
          trufflehog git "file://$PWD" \
            --no-update \
            --no-verification \
            --results=verified,unverified,unknown \
            --fail \
            --fail-on-scan-errors \
            > "${output_dir}/stdout" 2> "${output_dir}/stderr"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            printf 'trufflehog status=passed\n'
            exit 0
          fi
          printf 'trufflehog status=failed exit_code=%s\n' "${status}"
          exit "${status}"

  workflow-pack:
    name: Workflow pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install locked-range validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run schema, 24-process locking, atomic batch, guardian, recipe, and link tests
        run: python scripts/validate.py --component workflows

  control-plane:
    name: Python / control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-plane/requirements.txt
      - name: Install control-plane dependencies
        run: python -m pip install -r services/control-plane/requirements.txt
      - name: Run isolated control-plane tests
        run: python scripts/validate.py --component control-plane

  worker-agent:
    name: Python / worker-agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker-agent/requirements.txt
      - name: Install worker-agent dependencies
        run: python -m pip install -r services/worker-agent/requirements.txt
      - name: Run isolated worker-agent tests
        run: python scripts/validate.py --component worker-agent

  vm-agent:
    name: Go / vm-agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/vm-agent/go.mod
          cache: true
          cache-dependency-path: services/vm-agent/go.sum
      - name: Hydrate public Go modules
        working-directory: services/vm-agent
        run: go mod download
      - name: Verify Go modules and tidy state
        working-directory: services/vm-agent
        run: |
          go mod verify
          go mod tidy -diff
      - name: Install pinned official Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run Go tests, replay stress, vet, and disposable main build offline
        run: python scripts/validate.py --component vm-agent
      - name: Run Go race detector
        working-directory: services/vm-agent
        run: go test -race -count=1 ./...
      - name: Scan reachable Go vulnerabilities against the official database
        working-directory: services/vm-agent
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  desktop:
    name: Desktop / lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Run offline renderer, Electron main/preload, local-service, and unit checks
        run: python scripts/validate.py --component desktop
      - name: Rescan generated desktop dist artifacts
        run: python scripts/check_public_boundary.py .

  admin:
    name: Admin / tests, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install locked admin dependencies
        working-directory: apps/admin
        run: npm ci
      - name: Test and build admin console
        run: python scripts/validate.py --component admin
      - name: Rescan generated admin dist artifacts
        run: python scripts/check_public_boundary.py .

  mobile:
    name: Mobile / typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck mobile harness
        run: python scripts/validate.py --component mobile

  local-stack:
    name: Local stack / Compose round trip
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: deploy/local/docker-compose.local-dev.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
      - name: Parse Compose model
        run: docker compose config --quiet
      - name: Verify container-side key expansion survives rendering
        run: docker compose config | grep -F '$key_file'
      - name: Build and start localhost stack
        run: docker compose up -d --build
      - name: Wait for control-plane readiness
        run: python scripts/wait_for_http.py http://127.0.0.1:8100/v1/health/ready --timeout 120 --json-field database
      - name: Execute worker round trip
        run: python scripts/submit_local_task.py --timeout 60
      - name: Verify capacity-aware backlog delivery
        run: python scripts/verify_task_lifecycle.py --count 10 --timeout 120
      - name: Kill a busy worker and verify leased recovery
        run: python scripts/verify_worker_crash_recovery.py --timeout 120
      - name: Execute reference Agent managed-task round trip
        run: node scripts/reference_agent_local_round_trip.mjs
      - name: Print bounded failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200
      - name: Stop stack and remove disposable volumes
        if: always()
        run: docker compose down -v --remove-orphans

  operations:
    name: Operations / health, backup, shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install operations test dependency
        run: python -m pip install -r requirements-validation.txt
      - name: Test health, WAL backup, and parse shell scripts
        run: python scripts/validate.py --component operations
