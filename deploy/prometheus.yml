global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: agent-workflow-platform
    environment: local

rule_files:
  - /etc/prometheus/alerts/awp.yml

scrape_configs:
  - job_name: awp-control-plane
    metrics_path: /metrics
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/awp_metrics_bearer_token
    static_configs:
      - targets: ["127.0.0.1:8100"]
