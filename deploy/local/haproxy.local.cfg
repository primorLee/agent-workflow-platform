global
    maxconn 256

defaults
    mode http
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend awp_localhost
    bind 0.0.0.0:18100
    option forwardfor
    default_backend awp_control_plane

backend awp_control_plane
    server control 127.0.0.1:8100 check
